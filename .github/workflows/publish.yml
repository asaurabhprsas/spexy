name: Publish Release to NPM

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM dist-tag override (e.g. latest, alpha, beta). Leave empty for auto-detection.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (validate without publishing)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict TypeScript typecheck
        run: pnpm run typecheck

      - name: Build Web UI & CLI distribution
        run: pnpm run build

      - name: Run test suite
        run: pnpm test

      - name: Verify workspace diagnostics
        run: node ./packages/cli/dist/bin.js doctor --compact

      - name: Dry-run package inspection
        run: cd packages/cli && npm pack --dry-run

      - name: Publish to NPM
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "Discovered package version: ${PKG_VERSION}"

          # Auto-detect dist-tag: Manual input > Git tag suffix > Package version suffix > 'latest'
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            DIST_TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_name }}" =~ -([a-zA-Z]+) ]]; then
            DIST_TAG="${BASH_REMATCH[1]}"
          elif [[ "${PKG_VERSION}" =~ -([a-zA-Z]+) ]]; then
            DIST_TAG="${BASH_REMATCH[1]}"
          else
            DIST_TAG="latest"
          fi

          echo "Publishing spexy-cli@${PKG_VERSION} to NPM with tag: ${DIST_TAG}..."
          cd packages/cli
          npm publish --tag "${DIST_TAG}" --access public
